<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary-color: #ff9900;
            --primary-glow: rgba(255, 153, 0, 0.4);
            --accent-green: #10b981;
            --accent-red: #ff9900;
            --radius: 16px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .gateway-card {
            background-color: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .gateway-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .loader-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
        }

        .loader-ring {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 80px;
            height: 80px;
            border: 4px solid transparent;
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .loader-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--primary-color);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p.status {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-color) 0%, #a78bfa 100%);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Metadata dashboard */
        .meta-dashboard {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            padding-bottom: 6px;
        }

        .meta-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .meta-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .meta-value {
            color: var(--text-primary);
            font-family: monospace;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .meta-value.url {
            color: var(--primary-color);
        }

        .action-link {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .action-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        /* Error view styling */
        .error-icon {
            font-size: 48px;
            color: var(--accent-red);
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="gateway-card">
        <div class="content" id="gateway-content">
            <!-- Loading view state -->

                <div class="loader-ring"></div>

            <h1>Rerouting to Destination</h1>
            <p class="status" id="status-text">Decrypting secure payload...</p>

            <div class="progress-bar">

            <div class="meta-dashboard" id="meta-dashboard" style="display: none;">
                <div class="meta-row">
                    <span class="meta-label">Source ID</span>

                <div class="meta-row">
                    <span class="meta-row-content"></span>
                    <span class="meta-label">Public ID</span>
                    <span class="meta-value" id="meta-public">-</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Collection ID</span>
                    <span class="meta-value" id="meta-collection">-</span>
                </div>
                <div class="meta-row">

            <a href="https://analgalore.com" id="direct-link" class="action-link" style="display: none;" rel="noopener noreferrer">
                Continue to Stream <i class="fa-solid fa-arrow-right-long"></i>
            </a>
        </div>
    </div>

    <script>
        // Custom Base64 URL-safe decode helper
        function decodeBase64Url(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) {
                str += '=';
            }
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        // Custom MessagePack binary unpacker (supporting only array, int, str, nil formats)
        function unpackMsgPack(bytes) {
            let offset = 0;

            function readByte() {
                if (offset >= bytes.length) throw new Error("Unexpected end of data");
                return bytes[offset++];
            }

            function readBytes(length) {
                if (offset + length > bytes.length) throw new Error("Unexpected end of data");
                const slice = bytes.subarray(offset, offset + length);
                offset += length;
                return slice;
            }

            function parse() {
                const typeByte = readByte();

                // positive fixint
                if (typeByte <= 0x7f) {
                    return typeByte;
                }

                // fixmap (0x80 - 0x8f)
                if (typeByte >= 0x80 && typeByte <= 0x8f) {
                    const length = typeByte - 0x80;
                    const map = {};
                    for (let i = 0; i < length; i++) {
                        const key = parse();
                        map[key] = parse();
                    }
                    return map;
                }

                // fixarray (0x90 - 0x9f)
                if (typeByte >= 0x90 && typeByte <= 0x9f) {
                    const length = typeByte - 0x90;
                    const arr = [];
                    for (let i = 0; i < length; i++) {
                        arr.push(parse());
                    }
                    return arr;
                }

                // array 16 (0xdc) — ProvatPorn uses this format
                if (typeByte === 0xdc) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const length = (b1 << 8) | b2;
                    const arr = [];
                    for (let i = 0; i < length; i++) {
                        arr.push(parse());
                    }
                    return arr;
                }

                // array 32 (0xdd)
                if (typeByte === 0xdd) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const b3 = readByte();
                    const b4 = readByte();
                    const length = ((b1 << 24) | (b2 << 16) | (b3 << 8) | b4) >>> 0;
                    const arr = [];
                    for (let i = 0; i < length; i++) {
                        arr.push(parse());
                    }
                    return arr;
                }

                // map 16 (0xde)
                if (typeByte === 0xde) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const length = (b1 << 8) | b2;
                    const map = {};
                    for (let i = 0; i < length; i++) {
                        const key = parse();
                        map[key] = parse();
                    }
                    return map;
                }

                // fixstr (0xa0 - 0xbf)
                if (typeByte >= 0xa0 && typeByte <= 0xbf) {
                    const length = typeByte - 0xa0;
                    const strBytes = readBytes(length);
                    return new TextDecoder().decode(strBytes);
                }

                // nil
                if (typeByte === 0xc0) {
                    return null;
                }

                // false
                if (typeByte === 0xc2) {
                    return false;
                }

                // true
                if (typeByte === 0xc3) {
                    return true;
                }

                // str 8
                if (typeByte === 0xd9) {
                    const length = readByte();
                    const strBytes = readBytes(length);
                    return new TextDecoder().decode(strBytes);
                }

                // str 16
                if (typeByte === 0xda) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const length = (b1 << 8) | b2;
                    const strBytes = readBytes(length);
                    return new TextDecoder().decode(strBytes);
                }

                // str 32
                if (typeByte === 0xdb) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const b3 = readByte();
                    const b4 = readByte();
                    const length = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
                    const strBytes = readBytes(length);
                    return new TextDecoder().decode(strBytes);
                }

                // array 16
                if (typeByte === 0xdc) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const length = (b1 << 8) | b2;
                    const arr = [];
                    for (let i = 0; i < length; i++) {
                        arr.push(parse());
                    }
                    return arr;
                }

                // array 32
                if (typeByte === 0xdd) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const b3 = readByte();
                    const b4 = readByte();
                    const length = (b1 << 24) | (b2 << 16) | (b3 << 8) | b4;
                    const arr = [];
                    for (let i = 0; i < length; i++) {
                        arr.push(parse());
                    }
                    return arr;
                }

                // uint 8
                if (typeByte === 0xcc) {
                    return readByte();
                }

                // uint 16
                if (typeByte === 0xcd) {
                    const b1 = readByte();
                    const b2 = readByte();
                    return (b1 << 8) | b2;
                }

                // uint 32
                if (typeByte === 0xce) {
                    const b1 = readByte();
                    const b2 = readByte();
                    const b3 = readByte();
                    const b4 = readByte();
                    return ((b1 << 24) | (b2 << 16) | (b3 << 8) | b4) >>> 0;
                }

                // negative fixint (0xe0 - 0xff)
                if (typeByte >= 0xe0) {
                    return typeByte - 0x100;
                }

                throw new Error("Unknown msgpack header code: " + typeByte);
            }

            return parse();
        }

        // Main gate routing execution
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const payload = params.get('l');

            if (!payload) {
                showError("No redirect payload provided in parameter 'l'.");
                return;
            }

            let decodedArray;
            try {
                const bytes = decodeBase64Url(payload);
                decodedArray = unpackMsgPack(bytes);
            } catch (err) {
                showError("Failed to decode payload: " + err.message);
                return;
            }

            if (!decodedArray || !Array.isArray(decodedArray)) {
                showError("Malformed payload data format.");
                return;
            }

            // Support both payload formats:
            // - Local format (fixarray size 5): URL is at index 4
            // - ProvatPorn format (array16 size 18): URL is at index 2
            let targetUrl = null;
            for (let i = 0; i < decodedArray.length; i++) {
                const el = decodedArray[i];
                if (typeof el === 'string' && el.startsWith('http')) {
                    targetUrl = el;
                    break;
                }
            }
            if (!targetUrl || typeof targetUrl !== 'string' || !targetUrl.startsWith('http')) {
                showError("Target redirection URL not found or invalid.");
                return;
            }

            // Populate dashboard info
            document.getElementById('meta-source').textContent = decodedArray[0] || 'Unknown';
            document.getElementById('meta-public').textContent = decodedArray[2] || 'Unknown';
            document.getElementById('meta-collection').textContent = decodedArray[12] || 'Unknown';

            try {
                const urlObj = new URL(targetUrl);
                document.getElementById('meta-target').textContent = urlObj.hostname;
            } catch (e) {
                document.getElementById('meta-target').textContent = targetUrl;
            }

            // Animate progress fill and redirect
            const progressFill = document.getElementById('progress-fill');
            const statusText = document.getElementById('status-text');
            const dashboard = document.getElementById('meta-dashboard');
            const directLink = document.getElementById('direct-link');

            dashboard.style.display = 'block';
            directLink.href = targetUrl;

            let percentage = 0;
            const interval = setInterval(() => {
                percentage += 5;
                progressFill.style.width = percentage + '%';

                if (percentage === 40) {
                    statusText.textContent = "Verifying routing signature...";
                } else if (percentage === 75) {
                    statusText.textContent = "Redirecting client...";
                } else if (percentage >= 100) {
                    clearInterval(interval);
                    statusText.innerHTML = "Success. Redirecting now...";
                    directLink.style.display = 'inline-block';

                    // Trigger actual redirection
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                }
            }, 50);
        });

        function showError(message) {
            const container = document.getElementById('gateway-content');
            container.innerHTML = `
                <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h1>Redirection Failed</h1>
                <p class="status">${message}</p>
                <a href="../index.html" class="action-link"><i class="fa-solid fa-arrow-left"></i> Return to Catalog</a>
            `;
        }
    </script>
