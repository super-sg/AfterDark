# Render blueprint.  Repo → New > Blueprint → pick this repo → Apply.
#
# This is configured for the FREE plan, which has two consequences worth being
# clear about rather than discovering later:
#
#   1. No persistent disk. The SQLite file lives on the container's ephemeral
#      filesystem, so it is wiped on every redeploy and every wake-from-sleep.
#      The app reseeds itself on an empty boot (src/bootstrap.js), so the site
#      always works — but accounts, posts and comments do not survive.
#   2. Free services sleep after ~15 minutes idle and take 30–60s to wake.
#      The scheduled wire pulls only run while the service is awake.
#
# To make it a real site, change `plan: free` to `plan: starter` and uncomment
# the disk block. That is the only difference; nothing in the code changes.
services:
  - type: web
    name: afterdark
    runtime: docker
    plan: free
    healthCheckPath: /

    # --- uncomment together with `plan: starter` for a durable database -----
    # disk:
    #   name: afterdark-data
    #   mountPath: /data
    #   sizeGB: 10

    envVars:
      - key: SESSION_SECRET
        generateValue: true      # Render generates and stores it; never in git
      # /tmp is writable on Render and lives as long as the container does.
      # Change both to /data/... when you attach the disk above.
      - key: DB_PATH
        value: /tmp/afterdark.db
      - key: IMAGE_CACHE_DIR
        value: /tmp/imgcache
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"               # Render terminates TLS in front of the app
      - key: CLUSTER
        value: "1"               # free plan is 0.1 CPU; one worker, not eight
      - key: ADMIN_USERS
        value: admin
      # Background image work, sized for 0.1 CPU. Without these the encoder
      # saturates the box and ordinary page loads swing from 60ms to 6s.
      # Raise them (or just delete them) on a paid instance.
      - key: SHARP_CONCURRENCY
        value: "1"
      - key: ENRICH_LIMIT
        value: "5"
      - key: WARM_LIMIT
        value: "8"

      # Where ad frames are served from. This MUST be a different origin to the
      # site or the banners will not fill — see the long comment in src/ads.js.
      # Render has no way to interpolate one service's URL into another's env,
      # so this is the one value you set by hand after the first deploy:
      # Dashboard > afterdark > Environment > ADS_ORIGIN, set to the URL of the
      # afterdark-ads service below (https://afterdark-ads.onrender.com).
      - key: ADS_ORIGIN
        sync: false

  # --------------------------------------------------------------------------
  # The ad frame origin.
  #
  # Same image, same repo, one env var different. It exists only so ad tags get
  # an origin of their own: they can use localStorage and render, while staying
  # cross-origin to the site and therefore unable to read the session cookie,
  # the page, or call the API as a signed-in reader.
  # --------------------------------------------------------------------------
  - type: web
    name: afterdark-ads
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ADS_ONLY
        value: "1"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: CLUSTER
        value: "1"
      - key: DB_PATH
        value: /tmp/afterdark-ads.db
      - key: IMAGE_CACHE_DIR
        value: /tmp/imgcache
      - key: SESSION_SECRET
        generateValue: true
      # Who is allowed to frame these ads. Set by hand to the main site's URL
      # (https://afterdark.onrender.com) — without it, frame-ancestors falls
      # back to 'self' and the site cannot embed them.
      - key: SITE_ORIGIN
        sync: false
